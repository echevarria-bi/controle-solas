<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controle de Qualidade</title>

<style>

body{
    font-family:Arial;
    max-width:500px;
    margin:auto;
    padding:20px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    cursor:pointer;
}

#preview{
    width:100%;
    max-height:300px;
    object-fit:contain;
    display:none;
    margin-bottom:10px;
    border:1px solid #ccc;
}

</style>

</head>

<body>

<h2>Registro de Erro</h2>

<input id="operador" placeholder="Operador">

<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>

<select id="material">
<option>EVA</option>
<option>TR</option>
<option>PVC</option>
<option>TPU</option>
</select>

<select id="erro">
<option>Bolha</option>
<option>Mancha</option>
<option>Rebarba</option>
<option>Falta de Material</option>
</select>

<input id="quantidade" type="number" placeholder="Quantidade">

<textarea id="observacao" placeholder="Observação"></textarea>

<label>Foto do defeito</label>

<input
    type="file"
    id="foto"
    accept="image/*">

<img id="preview">

<button onclick="salvar()">Salvar</button>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbwmHWmXQXzb7u_2cUFJcp7hgJ1asUMkpOBsCEHkIIG56hML7MvqCjhkwnxtHJkNmt0nzw/exec";

let fotoBase64 = "";

document.getElementById("foto").addEventListener("change", function(e){

    const arquivo = e.target.files[0];

    if(!arquivo) return;

    const reader = new FileReader();

    reader.onload = function(event){

        fotoBase64 = event.target.result;

        document.getElementById("preview").src = fotoBase64;
        document.getElementById("preview").style.display = "block";
    };

    reader.readAsDataURL(arquivo);

});

function salvar(){

    const dados = {
        operador: document.getElementById("operador").value,
        turno: document.getElementById("turno").value,
        material: document.getElementById("material").value,
        modelo: "Modelo A",
        maquina: "Injetora 01",
        erro: document.getElementById("erro").value,
        gravidade: "Média",
        quantidade: document.getElementById("quantidade").value,
        observacao: document.getElementById("observacao").value,
        foto: fotoBase64
    };

    console.log("Enviando:", dados);

    fetch(URL_API,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify(dados)
    });

    alert("Registro enviado!");
}

</script>

</body>
</html>
