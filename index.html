<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Qualidade</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:#1f2937;
    color:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header h1{
    font-size:24px;
}

.header p{
    margin-top:5px;
    color:#d1d5db;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:15px;
    color:#111827;
}

label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
    font-weight:bold;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:12px;
    font-size:14px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:16px;
    cursor:pointer;
}

.btn-foto{
    background:#2563eb;
    color:white;
    margin-bottom:10px;
}

.btn-salvar{
    background:#16a34a;
    color:white;
    font-weight:bold;
}

.btn-salvar:hover{
    background:#15803d;
}

#preview{
    width:100%;
    max-height:350px;
    object-fit:contain;
    display:none;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin-top:10px;
}

#foto{
    display:none;
}

#status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

@media(max-width:600px){

.grid{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
    <h1>CONTROLE DE QUALIDADE</h1>
    <p>Registro de Não Conformidades</p>

    <div class="info">
        <span id="ocorrencia">OC-2026-00001</span>
        <span id="dataHora"></span>
    </div>
</div>

<div class="card">

<h3>Dados da Produção</h3>

<label>Operador</label>
<input id="operador" placeholder="Nome do Operador">

<div class="grid">

<div>
<label>Turno</label>
<select id="turno">
<option>Manhã</option>
<option>Tarde</option>
<option>Noite</option>
</select>
</div>

<div>
<label>Linha</label>
<select id="linha">
<option>Linha 01</option>
<option>Linha 02</option>
<option>Linha 03</option>
<option>Linha 04</option>
</select>
</div>

</div>

<div class="grid">

<div>
<label>Máquina</label>
<select id="maquina">
<option>Injetora 01</option>
<option>Injetora 02</option>
<option>Injetora 03</option>
<option>Prensa 01</option>
<option>Prensa 02</option>
</select>
</div>

<div>
<label>Material</label>
<select id="material">
<option>EVA</option>
<option>TR</option>
<option>PVC</option>
<option>TPU</option>
<option>Borracha</option>
</select>
</div>

</div>

<label>Modelo</label>
<select id="modelo">
<option>Modelo A</option>
<option>Modelo B</option>
<option>Modelo C</option>
<option>Modelo D</option>
</select>

</div>

<div class="card">

<h3>Dados da Ocorrência</h3>

<label>Tipo de Erro</label>
<select id="erro">
<option>Bolha</option>
<option>Mancha</option>
<option>Rebarba</option>
<option>Falta de Material</option>
<option>Deformação</option>
<option>Quebra</option>
<option>Contaminação</option>
</select>

<div class="grid">

<div>
<label>Gravidade</label>
<select id="gravidade">
<option>Baixa</option>
<option>Média</option>
<option>Alta</option>
<option>Crítica</option>
</select>
</div>

<div>
<label>Quantidade</label>
<input id="quantidade" type="number">
</div>

</div>

</div>

<div class="card">

<h3>Evidência Fotográfica</h3>

<input
type="file"
id="foto"
accept="image/*"
capture="environment">

<button
type="button"
class="btn-foto"
onclick="document.getElementById('foto').click()">
📷 Tirar Foto
</button>

<img id="preview">

</div>

<div class="card">

<h3>Observações</h3>

<textarea
id="observacao"
placeholder="Descreva o ocorrido..."></textarea>

</div>

<button
class="btn-salvar"
id="btnSalvar"
onclick="salvar()">
✓ Registrar Ocorrência
</button>

<div id="status">
✓ Ocorrência registrada com sucesso
</div>

</div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbwmHWmXQXzb7u_2cUFJcp7hgJ1asUMkpOBsCEHkIIG56hML7MvqCjhkwnxtHJkNmt0nzw/exec";

let fotoBase64 = "";

document.getElementById("dataHora").innerText =
new Date().toLocaleString("pt-BR");

document.getElementById("foto").addEventListener("change", function(e){

    const arquivo = e.target.files[0];

    if(!arquivo) return;

    const reader = new FileReader();

    reader.onload = function(event){

        fotoBase64 = event.target.result;

        document.getElementById("preview").src = fotoBase64;
        document.getElementById("preview").style.display = "block";

    };

    reader.readAsDataURL(arquivo);

});

function limparFormulario(){

    document.getElementById("operador").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("observacao").value = "";

    document.getElementById("foto").value = "";

    fotoBase64 = "";

    document.getElementById("preview").style.display = "none";

}

function salvar(){

    document.getElementById("btnSalvar").innerText = "Salvando...";

    const dados = {

        operador: document.getElementById("operador").value,
        turno: document.getElementById("turno").value,
        material: document.getElementById("material").value,
        modelo: document.getElementById("modelo").value,
        maquina: document.getElementById("maquina").value,
        erro: document.getElementById("erro").value,
        gravidade: document.getElementById("gravidade").value,
        quantidade: document.getElementById("quantidade").value,
        observacao: document.getElementById("observacao").value,
        foto: fotoBase64

    };

    fetch(URL_API,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify(dados)
    });

    document.getElementById("status").style.display = "block";

    limparFormulario();

    document.getElementById("btnSalvar").innerText =
    "✓ Registrar Ocorrência";

}

</script>

</body>
</html>
